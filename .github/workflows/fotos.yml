# Baja a anuncios/fotos/ las fotos de Unsplash listadas en anuncios/fotos.txt (rama anuncios-fotos).
name: Fotos para anuncios
on:
  push:
    branches: [anuncios-fotos]
    paths: ['anuncios/fotos.txt']
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar
        run: |
          mkdir -p anuncios/fotos
          while read id; do
            [ -z "$id" ] && continue
            [ -f "anuncios/fotos/${id}.jpg" ] && continue
            case "$id" in
              photo-*) url="https://images.unsplash.com/${id}?auto=format&fm=jpg&fit=max&q=88&w=2400" ;;
              *) pag=$(curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "https://unsplash.com/photos/${id}" || true)
                 base=$(printf '%s' "$pag" | grep -o 'https://images.unsplash.com/photo-[0-9a-z-]*' | head -1)
                 echo "id $id -> ${base:-sin imagen} ($(printf '%s' "$pag" | wc -c) bytes)"
                 [ -z "$base" ] && { echo "falla $id"; continue; }
                 url="${base}?auto=format&fm=jpg&fit=max&q=88&w=2400" ;;
            esac
            curl -sSfL "$url" -o "anuncios/fotos/${id}.jpg" && echo "ok $id" || echo "falla $id"
          done < anuncios/fotos.txt
          ls -la anuncios/fotos
      - name: Guardar
        run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add anuncios/fotos
          git commit -m "Fotos para anuncios" || echo "nada nuevo"
          git push
