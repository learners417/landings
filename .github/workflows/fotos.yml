# Baja a anuncios/fotos/ las fotos de Unsplash listadas en anuncios/fotos.txt (rama anuncios-fotos).
name: Fotos para anuncios
on:
  push:
    branches: [anuncios-fotos]
    paths: ['anuncios/fotos.txt']
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar
        run: |
          mkdir -p anuncios/fotos
          while read id; do
            [ -z "$id" ] && continue
            curl -sSfL "https://images.unsplash.com/${id}?auto=format&fm=jpg&fit=max&q=88&w=2400" -o "anuncios/fotos/${id}.jpg" && echo "ok $id" || echo "falla $id"
          done < anuncios/fotos.txt
          ls -la anuncios/fotos
      - name: Guardar
        run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add anuncios/fotos
          git commit -m "Fotos para anuncios" || echo "nada nuevo"
          git push
