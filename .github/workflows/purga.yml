# Cada vez que se publica en main, se vacía la caché de jsDelivr de las páginas que cambiaron,
# para que tuclinica.digital muestre la versión nueva en minutos y no en horas.
name: Purga jsDelivr
on:
  push:
    branches: [main]
    paths: ['site/**', 'cargador.js', '.github/workflows/purga.yml']
jobs:
  purga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Purgar lo que cambió
        run: |
          ANTES="${{ github.event.before }}"
          if git cat-file -e "$ANTES^{commit}" 2>/dev/null && git diff --quiet "$ANTES" HEAD -- .github/workflows/purga.yml; then
            LISTA=$(git diff --name-only "$ANTES" HEAD -- site/ cargador.js)
          else
            LISTA=$(git ls-files site/ cargador.js)   # la primera vez, o si cambió este archivo: se purga todo site/ y el cargador
          fi
          # jsDelivr ya no puede bajar el repo entero (pasa su tope de 50 MB): cada archivo lo trae de GitHub (raw),
          # que guarda cada archivo hasta 5 minutos, y además sus servidores de origen guardan su copia cerca de una hora
          # (la purga no las borra). Si la purga cae antes, un servidor de jsDelivr se queda con el anterior por horas.
          # 19 nov: por eso se purga tres veces: al minuto (casi siempre alcanza), pasados los 5 minutos de GitHub
          # y a la hora y cinco, cuando ya no queda ninguna copia vieja en el origen de jsDelivr.
          purgar() {
            echo "$LISTA" | while read f; do
              [ -z "$f" ] && continue
              echo "purga $f"
              curl -s -o /dev/null -w "%{http_code}\n" "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || true
              sleep 1
            done
          }
          sleep 60
          purgar
          sleep 280
          echo "segunda vuelta"
          purgar
          sleep 3600
          echo "tercera vuelta"
          purgar
