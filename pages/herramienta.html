<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu herramienta · Javo Katz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&display=swap">
<style>/*EDICION_CSS*/</style>
<script>
/* El link de los correos de entrega: /herramienta?h=phr lleva adonde está hoy esa herramienta (TCD.herramientas)
   y, si no tiene página propia, a la comunidad. Quien llega desde el correo ya dejó su correo: no se le vuelve a pedir. */
(function () {
  var C = window.TCD || {};
  var h = '';
  try { h = (new URLSearchParams(location.search).get('h') || '').toLowerCase().replace(/[^a-z-]/g, ''); } catch (e) {}
  var destino = ((C.herramientas || {})[h]) || C.comunidad || '/para-empezar';
  try { localStorage.setItem('tcd_lector', '1'); } catch (e) {}
  window.TCD_DESTINO = destino;
  if (!/claude\.ai|claudeusercontent|localhost|^file:/.test(location.href)) location.replace(destino);
})();
</script>
</head>
<body data-pagina="herramienta">
<main style="padding:18vh 0 0">
 <div class="wrap" style="max-width:640px">
  <p class="serie">Para empezar</p>
  <h1 style="font-size:clamp(44px,11vw,64px);line-height:1;margin-top:14px">Te llevo a tu herramienta.</h1>
  <p class="bajada">Si en unos segundos no se abre, <a class="link" id="ir" href="#">entra aquí</a>.</p>
 </div>
</main>
<script>/*EDICION_JS*/</script>
<script>(function(){var a=document.getElementById('ir');if(a&&window.TCD_DESTINO)a.href=window.TCD_DESTINO;})();</script>
</body>
</html>
